version: '3'

tasks:
  dev:
    desc: Start the dev server
    cmds:
      - pnpm astro dev
  build:
    desc: Build the static site
    cmds:
      - pnpm astro build
  check:
    desc: Type check, lint, format check and unit tests
    cmds:
      - pnpm astro check
      - pnpm eslint .
      - pnpm prettier --check .
      - pnpm vitest run
  e2e:
    desc: Run Playwright tests
    cmds:
      - pnpm playwright test
  budgets:
    desc: Check per-page gzipped JS and CSS budgets against dist
    cmds:
      - node scripts/check-budgets.mjs dist
  lighthouse:
    desc: Run Lighthouse CI against dist (needs Chrome; set CHROME_PATH if needed)
    cmds:
      - pnpm lhci autorun
  empty:
    desc: Build with empty content folders and assert the empty states render
    cmds:
      - node scripts/check-empty.mjs
  gate:
    desc: Everything CI runs except Lighthouse
    cmds:
      - task: check
      - task: build
      - task: budgets
      - task: empty
      - task: e2e
